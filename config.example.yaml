# 复制为 config.yaml 后填写（config.yaml 已被 .gitignore 忽略）
# manga.json（放在漫画目录里）支持的自动组合字段：
#   event(展会 C105) / author(画师名) / circle(社团) / group(汉化组)
#   title(中文标题) / title_jp / title_en(罗马音) / series(东方)
#   series_en(Touhou Project) / series_jp(東方Project) / tags / description
#   章节目录较多时写在 chapters 条目里；各平台可另存覆盖值，详见
#   manga_uploader/composer.py 文件头。
common:
  timeout: 30          # 单次请求超时（秒）
  retries: 3           # 网络错误重试次数
  interval_seconds: 1  # 平台间请求间隔（秒，0 为不限制）
  max_width: 2400      # 上传前图片最长边（0 = 不缩放；只等比缩小，不裁剪）
  max_height: 0
  quality: 88          # JPEG/WebP 压缩质量
  max_bytes_mb: 10     # 单张图片大小上限（MB，超限自动压缩；再漫画强制 10MB）
  output_dir: output   # 报告/调试文件目录
  confirm: true        # 发布前二次确认
  parallel: false      # 多个章节并行发布
  proxy_url: ""        # 手动代理，如 http://127.0.0.1:7890（留空则直连）
  use_system_proxy: false  # true 时自动读取 Windows 系统代理；海外站连不上再开

  # 罗马音 AI 转换（可选）：填 OpenAI 兼容接口后，“展会/作者/社团/日文标题
  # → 罗马音（AI）”按钮会优先调用大模型自动分词读音；失败自动回退本地引擎。
  ai_enabled: false
  ai_base_url: ""       # 例如 https://api.deepseek.com/v1（/v1 可省略）
  ai_api_key: ""
  ai_model: ""          # 例如 deepseek-chat / gpt-4o-mini
  ai_prompt: ""         # 留空用内置默认提示词（转换结果格式见 composer.ai_to_romaji）
  ai_timeout: 60

platforms:
  bilibili:
    enabled: true
    # 获取方式见 README「Cookie 获取」
    cookies:
      SESSDATA: ""
      bili_jct: ""
      buvid3: ""       # 建议填写，能避免分享弹窗
    settings:
      publish_mode: article     # article = 发专栏文章；dynamic = 图文动态（旧）
      tid: 4                    # 4 = 单图封面模板；3 = 三图封面
      category: 0               # 专栏分类 id，0 = 默认
      original: 1               # 1 = 声明原创（授权转载请按平台要求设为 0）
      reprint: 0                # 0 = 原创；1 = 转载
      max_article_pages: 100    # 单篇专栏最多放多少张图，超出自动拆成多篇
      upload_attempts: 3        # 单张图上传失败自动重试轮数（B站偶发抽风）
      image_category: draw      # daily / draw / cos
      max_pages_per_post: 9     # 仅图文动态模式：单条最多 9 张，超出自动拆条
      topics: ["原创漫画"]      # 仅图文动态模式：动态话题，可多个
      use_system_proxy: false   # 国内站默认直连，不跟随全局代理
      proxy_url: ""             # 需要时再单独填

  tieba:
    enabled: true
    cookies:
      BDUSS: ""
    settings:
      forum: ""                 # 目标吧名，例如 "漫画吧"
      fid: 0                    # 吧 ID；留 0 自动解析，解析失败再手动填
      max_pages_per_post: 9     # 每楼最多 9 张（网页端硬上限）；第 1 楼固定只放封面
      upload_sleep: 1.0         # 每张图上传间隔（秒），防频控
      title_suffix: ""          # 已废弃：标题自动按【汉化组】中文标题生成
      use_system_proxy: false   # 国内站默认直连
      proxy_url: ""

  ehentai:
    enabled: true
    cookies:
      ipb_member_id: ""
      ipb_pass_hash: ""
    settings:
      category_label: "Doujinshi"       # 默认同人志（汉化搬运常用），可选 Non-H/Manga 等
      rating_label: ""                  # 例如 Safe / Questionable / Adult
      language_label: "Chinese"         # 汉化上传默认中文；原版/无字改 Japanese / No Text
      extra_tags: []
      publish_after_upload: true       # 上传后自动正式发布；false=只建草稿到 My Uploads
      upload_mode: zip                 # zip=整包归档上传（推荐）；files=逐张多文件（旧路径）
      use_system_proxy: true           # e-hentai 是海外站：可单独走代理
      proxy_url: "http://127.0.0.1:7897"  # 改成你实际代理端口；不需要就留空
      # 画廊类型/语言/语言类型/标题/评论等请在
      # “漫画与压缩 → 各平台发布内容”里配置，会写入 manga.json 覆盖自动组合。

  zaimanhua:
    enabled: true
    cookies:
      token: ""                         # 登录再漫画后 Cookie 里的 token（JWT）
      clientId: ""                      # 可选
    settings:
      cate: "1"                         # 1 原创作品 / 2 原创汉化 / 3 个人扫漫 / 4 转载作品
      work_name: ""                     # 作品名，留空用 manga.json 的 title
      chapter_name: ""                  # 章节名，留空用章节标题
      max_pages_per_upload: 500         # 单次提交上限（再漫画固定 500 张）
      upload_attempts: 2                # 单张图片上传失败自动重试次数
      use_system_proxy: false           # 国内站默认直连，不跟随全局代理
      proxy_url: ""                     # 需要时再单独填，如 http://127.0.0.1:7897
